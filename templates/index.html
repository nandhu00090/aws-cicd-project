<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nandhu's DevOps Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; text-align: center; margin-top: 10%; }
        .card { background-color: #1e1e1e; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(255, 87, 34, 0.2); display: inline-block; border-top: 5px solid #ff5722; }
        h1 { color: #ff5722; }
        h2 { color: #4caf50; }
        .footer { margin-top: 30px; font-size: 0.9em; color: #888; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 CI/CD Automation is 100% SUCCESS!</h1>
        <h3>Welcome to Nandhu's Enterprise Dashboard</h3>
        <hr style="border-color: #333; margin: 20px 0;">
        <h2>Total Dashboard Views: <span style="color: #fff;">{{ count }}</span> 🔥</h2>
        <div class="footer">Deployed dynamically via GitHub Actions & Docker</div>
    </div>
</body>
</html>
